<div class="container mt-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="bi bi-clock-history"></i> Lịch sử sản phẩm đã thêm vào giỏ</h2>
    <button *ngIf="isLocalSession" class="btn btn-warning" (click)="syncCart()">
      <i class="bi bi-arrow-repeat"></i> Đồng bộ vào tài khoản
    </button>
  </div>

  <div class="card shadow-sm">
    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-striped table-hover align-middle mb-0">
          <thead class="table-dark">
            <tr>
              <th>Sản phẩm</th>
              <th class="text-center">Giá bán</th>
              <th class="text-center">Số lượng</th>
              <th class="text-center">Ngày thêm</th>
              <th class="text-center">Trạng thái</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngIf="isLoading">
              <td colspan="5" class="text-center py-4">
                <div class="spinner-border text-primary" role="status"></div>
              </td>
            </tr>

            <tr *ngIf="!isLoading && cartHistoryList.length === 0">
              <td colspan="5" class="text-center text-muted py-4">Chưa có lịch sử thêm sản phẩm nào.</td>
            </tr>

            <tr *ngFor="let item of cartHistoryList">
              <td><strong>{{ item.productName }}</strong></td>
              <td class="text-center text-danger fw-bold">{{ item.price | currency:'VND':'symbol':'1.0-0' }}</td>
              <td class="text-center"><span class="badge bg-secondary fs-6">{{ item.quantity }}</span></td>
              <td class="text-center text-muted">{{ item.addedDate | date:'dd/MM/yyyy HH:mm' }}</td>
              <td class="text-center">
                <span class="badge bg-success">Đã lưu</span>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
